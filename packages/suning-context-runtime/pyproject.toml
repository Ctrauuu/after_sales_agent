[project]
name = "suning-context-runtime"
version = "0.1.0"
description = "Python 3.11+ shared conversation context runtime for Suning Hermes"
requires-python = ">=3.11"
dependencies = [
    "dashscope>=1.26.6",
    "langchain>=1.2.0,<2.0.0",
    "langchain-community>=0.4.1,<1.0.0",
    "langchain-deepseek>=1.0.1,<2.0.0",
    "langchain-text-splitters>=1.1.0,<2.0.0",
    "pydantic>=2.12.0,<3.0.0",
    "pymilvus==3.0.1",
    "pymysql>=1.1.0,<2.0.0",
    "redis>=5.0.0,<9.0.0",
    "sqlalchemy>=2.0.0,<3.0.0",
]

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
