[project]
name = "suning-hermes-agent"
version = "0.1.0"
description = "Backend and FastMCP services for the Suning Hermes after-sales agent"
readme = "README.md"
authors = [
    { name = "chenyunhong", email = "415853515@qq.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "fastmcp>=3.4.5",
    "httpx>=0.28.1",
    "jsonschema>=4.26,<5",
    "matplotlib>=3.10,<4",
    "numpy>=2.0,<3",
    "opentelemetry-exporter-otlp-proto-http>=1.44,<2",
    "opentelemetry-sdk>=1.44,<2",
    "pydantic-settings>=2.14.2",
    "PyYAML>=6.0.3",
    "pymysql>=1.2.0",
    "redis>=8.1.0",
    "sqlalchemy>=2.0.51",
    "starlette>=1.3,<2",
    "suning-context-runtime",
    "uvicorn>=0.52,<1",
]

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.uv.sources]
suning-context-runtime = { path = "../packages/suning-context-runtime", editable = true }
